<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber VIP Store</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 14px;
    text-align: center; min-height: 100vh; color: #222;
    background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
  }
  h2 { font-size: 18px; margin: 6px 0 14px; }
  .grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
    max-width: 500px; margin: 0 auto; padding-bottom: 30px;
  }
  .btn {
    display: flex; align-items: center; gap: 8px; background: #5c7cfa; color: #fff;
    border: 0; padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 700;
    cursor: pointer; width: 100%; text-align: right;
    box-shadow: 0 4px 6px rgba(0,0,0,.12); transition: transform .15s;
  }
  .btn:active { transform: scale(.96); }
  .btn img {
    width: 22px; height: 22px; border-radius: 5px; background: #fff;
    padding: 2px; object-fit: contain; flex: 0 0 auto;
  }
  .btn .t { flex: 1; }
  .full { grid-column: span 2; }
  .card {
    background: #fff; border-radius: 12px; padding: 10px; text-align: right;
    display: flex; flex-direction: column; gap: 6px;
    box-shadow: 0 3px 8px rgba(0,0,0,.1);
  }
  .card .name { font-size: 12px; font-weight: 700; line-height: 1.35; }
  .card .price { color: #2f9e44; font-weight: 800; font-size: 13px; }
  .card .buy {
    background: #5c7cfa; color: #fff; border: 0; border-radius: 8px;
    padding: 7px; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .card.out { opacity: .55; }
  .card.out .buy { background: #adb5bd; cursor: default; }
  .back { background: #495057; margin-bottom: 4px; }
  .msg {
    background: rgba(255,255,255,.75); padding: 16px;
    border-radius: 12px; font-size: 13px; font-weight: 600;
  }
  .spin { font-size: 13px; }
  .order {
    grid-column: span 2; background: #fff; border-radius: 12px; padding: 14px;
    text-align: right; font-size: 13px; line-height: 1.7;
    box-shadow: 0 3px 8px rgba(0,0,0,.1);
  }
  .order h3 { font-size: 15px; margin: 0 0 8px; }
  .order .pay { background: #f1f3f5; border-radius: 10px; padding: 10px; margin: 8px 0; }
  .order code { direction: ltr; display: inline-block; word-break: break-all; font-size: 12px; }
  .order .send { background: #2f9e44; }
  .card.open { grid-column: span 2; opacity: 1; }
  .card .hint { font-size: 11px; color: #5c7cfa; font-weight: 700; }
  .card-sub {
    border-top: 1px solid #e9ecef; margin-top: 6px; padding-top: 8px;
    display: flex; flex-direction: column; gap: 6px; text-align: right;
  }
  .card-sub .cs-name { font-size: 13px; font-weight: 700; }
  .card-sub .cs-price { color: #2f9e44; font-weight: 800; font-size: 14px; }
  .card .buy-now { justify-content: center; background: #2f9e44; width: 100%; }
  .card-order { text-align: right; font-size: 12px; line-height: 1.7; margin-top: 4px; }
  .card-order .co-title { font-size: 13px; }
  .card-order .co-note { margin: 6px 0; }
  .card-order .pay { background: #f1f3f5; border-radius: 10px; padding: 8px; margin: 6px 0; }
  .card-order code { direction: ltr; display: inline-block; word-break: break-all; font-size: 11px; }
  .card-order .send { background: #2f9e44; width: 100%; justify-content: center; }

</style>
</head>
<body>

<h2 id="title">🛍️ اختر قسمًا:</h2>
<div id="grid" class="grid"></div>
<div id="list" class="grid" hidden></div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor('#e0c3fc'); } catch (e) {}

const API_URL = 'https://cybervipstorebot-production.up.railway.app/api/products';
const BOT = 'CyberVIPStore_bot';

/* طرق الدفع: مطابقة لما في bot.py */
const PAY_HTML = `
  <div class="pay">
    🏛 <b>1️⃣ التحويل عبر Attijari Wafabank:</b><br>
    🔹 النوع: <code>حساب شخصي</code><br>
    🔹 RIB: <code>007330000463500031156848</code><br>
    🔹 SWIFT: <code>BCMAMAMC</code>
  </div>
  <div class="pay">
    🏛 <b>2️⃣ التحويل عبر CIH Bank:</b><br>
    🔹 النوع: <code>حساب تجاري</code><br>
    🔹 RIB: <code>230330654524922100580038</code><br>
    🔹 SWIFT: <code>CIHMMAMC</code>
  </div>
  <div class="pay">
    🟡 <b>3️⃣ بايننس (Binance USDT / Pay):</b><br>
    🔹 شبكة USDT (TRC20): <code>ضع_عنوان_محفظة_الـ_USDT_هنا</code><br>
    🔹 Binance Pay ID / UID: <code>307299882</code>
  </div>`;

const CATS = [
  { cat: 'All',                 title: 'كل المنتجات المتاحة', img: 'https://img.icons8.com/color/512/shopping-bag.png', full: true },
  { cat: 'Google AI & Gemini',  title: 'Gemini AI Pro',        img: 'gemini_logo.png' },
  { cat: 'Canva',               title: 'Canva Pro',            img: 'Canva_logo_PNG12.png' },
  { cat: 'CapCut',              title: 'CapCut Pro',           img: 'CapCut-Emblem.png' },
  { cat: 'Muse AI',             title: 'Muse AI',              img: 'Muse_logo_PNG3.png' },
  { cat: 'Claude API',          title: 'Claude API',           img: 'Claude-Logo-PNG4.png' },
  { cat: 'ChatGPT & Codex',     title: 'ChatGPT',              img: 'ChatGPT_Logo_PNG1.png' },
  { cat: 'Adobe',               title: 'Adobe',                img: 'Adobe_logo_PNG14.png' },
  { cat: 'Figma Pro',           title: 'Figma Pro',            img: 'Figma-Logo-PNG_001.png' },
  { cat: 'Miro Pro',            title: 'Miro Pro',             img: 'miro_logo.png' },
  { cat: 'Framer AI',           title: 'Framer AI',            img: 'framer_logo.png' },
  { cat: 'JetBrains Pro',       title: 'JetBrains Pro',        img: 'jetbrains_logo.png' },
  { cat: 'Notion',              title: 'Notion',               img: 'Notion-Logo.png' },
  { cat: 'Microsoft',           title: 'Microsoft 365',        img: 'microsoft_PNG4.png' },
  { cat: 'Windows Key',         title: 'Windows Key',          img: 'Windows_logo_PNG5.png' },
  { cat: 'Autodesk',            title: 'Autodesk',             img: 'Autodesk_logo_PNG2.png' },
  { cat: 'Duolingo Super',      title: 'Duolingo Super',       img: 'Duolingo_logo_PNG1.png' },
  { cat: 'Coursera Premium',    title: 'Coursera Premium',     img: 'Coursera_Logo_PNG4.png' },
  { cat: 'edX Premium',         title: 'edX Premium',          img: 'edX-Logo.png' },
  { cat: 'YouTube Premium',     title: 'YouTube Premium',      img: 'Youtube_logo_PNG3.png' },
  { cat: 'Prime Video',         title: 'Prime Video',          img: 'Amazon_Prime_Video_Logo_PNG3.png' },
  { cat: 'Apple TV',            title: 'Apple TV',             img: 'Apple-Music-Logo-PNG_003.png' },
  { cat: 'Shahid VIP',          title: 'Shahid VIP',           img: 'Shahid App-01.png' },
  { cat: 'Crunchyroll Premium', title: 'Crunchyroll',          img: 'Crunchyroll_logo_PNG9.png' },
  { cat: 'Spotify Premium',     title: 'Spotify Premium',      img: 'spotify_logo_PNG5.png' },
  { cat: 'Email Accounts',      title: 'Outlook',              img: 'Outlook_Logo_PNG6.png' },
  { cat: 'Gmail',               title: 'Gmail',                img: 'Gmail-Logo-PNG1.png' },
  { cat: 'Instagram',           title: 'Facebook & Insta',     img: 'InstagramPNG.png' },
  { cat: 'LinkedIn',            title: 'LinkedIn',             img: 'Linkedin_logo_PNG3.png' },
  { cat: 'Telegram',            title: 'Telegram',             img: 'Telegram_logo_PNG2.png' },
  { cat: 'Steam',               title: 'Steam',                img: 'Steam_logo_PNG2.png' },
  { cat: 'ExpressVPN',          title: 'ExpressVPN',           img: 'ExpressVPN-logo.png' },
  { cat: 'NordVPN',             title: 'NordVPN',              img: 'NordVPN-Logo-PNG3.png' },
  { cat: 'Surfshark VPN',       title: 'Surfshark VPN',        img: 'surfshark_logo.png' },
  { cat: 'Proton VPN',          title: 'Proton VPN',           img: 'proton-vpn.png' },
  { cat: 'HMA VPN',             title: 'HMA VPN',              img: 'hma-vpn-logo.png' },
  { cat: 'Avira Prime',         title: 'Avira Prime',          img: 'avira_logo.png' },
  { cat: 'Scribd Premium',      title: 'Scribd Premium',       img: 'scribd_logo.png', full: true },
];

const elGrid  = document.getElementById('grid');
const elList  = document.getElementById('list');
const elTitle = document.getElementById('title');

let ALL = null;
let currentCat = null;
let inOrder = false;

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function backButton(label, onClick) {
  const b = document.createElement('button');
  b.className = 'btn back full';
  b.innerHTML = '<span class="t">' + label + '</span>';
  b.addEventListener('click', onClick);
  return b;
}

function showBack() { try { tg.BackButton.show(); } catch (e) {} }
function hideBack() { try { tg.BackButton.hide(); } catch (e) {} }

/* شاشة الأقسام */
function renderCategories() {
  currentCat = null;
  inOrder = false;
  elTitle.textContent = '🛍️ اختر قسمًا:';
  elGrid.hidden = false;
  elList.hidden = true;
  elGrid.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'btn' + (c.full ? ' full' : '');
    b.innerHTML =
      `<img src="${c.img}" alt="" onerror="this.style.display='none'">` +
      `<span class="t">${c.title}</span>`;
    b.addEventListener('click', () => showProducts(c.cat));
    elGrid.appendChild(b);
  });
  hideBack();
}

/* شاشة منتجات القسم */
let openCard = null;     // البطاقة المفتوحة حالياً (تظهر تحتها خانة الطلب)
let paymentBox = null;   // صندوق تفاصيل الدفع في أسفل القائمة

function closeCard() {
  if (openCard) {
    openCard.classList.remove('open');
    const btn = openCard.querySelector('.buy-now');
    if (btn) btn.remove();
    const hint = openCard.querySelector('.hint');
    if (hint) hint.style.display = '';
    openCard = null;
  }
}

function closePayment() {
  if (paymentBox) { paymentBox.remove(); paymentBox = null; }
}

function showProducts(cat) {
  currentCat = cat;
  closeCard();
  closePayment();
  inOrder = false;
  const found = CATS.find(c => c.cat === cat);
  elTitle.textContent = cat === 'All' ? '📦 كل المنتجات' : '📦 ' + (found ? found.title : cat);
  elGrid.hidden = true;
  elList.hidden = false;
  elList.innerHTML = '';
  elList.appendChild(backButton('↩ رجوع إلى الأقسام', renderCategories));

  if (ALL === null) {
    elList.insertAdjacentHTML('beforeend', '<div class="msg full spin">⏳ جاري تحميل المنتجات…</div>');
    showBack();
    return;
  }

  const items = ALL.filter(p => cat === 'All' || p.category === cat);
  if (items.length === 0) {
    elList.insertAdjacentHTML('beforeend', '<div class="msg full">❌ لا توجد منتجات في هذا القسم حاليًا.</div>');
    showBack();
    return;
  }

  items.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card' + (p.in_stock ? '' : ' out');
    card.innerHTML = `
      <div class="name">${p.emoji || '📦'} ${escapeHtml(p.name)}</div>
      <div class="price">${p.in_stock ? '$' + p.price : 'نفد'}</div>
      <div class="hint">${p.in_stock ? '👆 اضغط للطلب' : 'غير متوفر'}</div>`;
    if (p.in_stock) {
      card.addEventListener('click', () => toggleCard(p, card));
    }
    elList.appendChild(card);
  });
  showBack();
}

/* الضغط على المنتج: تظهر خانة تحته فيها الاسم والسعر وزر "اطلب الآن" */
function toggleCard(p, card) {
  if (openCard === card) { closeCard(); showBack(); return; }
  closeCard();
  closePayment();

  const hint = card.querySelector('.hint');
  if (hint) hint.style.display = 'none';

  const btn = document.createElement('button');
  btn.className = 'btn buy-now full';
  btn.innerHTML = '<span class="t">🛒 اطلب الآن</span>';
  btn.addEventListener('click', e => {
    e.stopPropagation();
    showPayment(p);
  });
  card.appendChild(btn);

  card.classList.add('open');
  openCard = card;
  card.scrollIntoView({ behavior: 'smooth', block: 'start' });
  showBack();
}

/* بعد "اطلب الآن": تظهر تفاصيل البنك والإرسال في أسفل القائمة */
function showPayment(p) {
  closePayment();
  paymentBox = document.createElement('div');
  paymentBox.className = 'order';
  paymentBox.innerHTML = `
    <h3>${p.emoji || '📦'} ${escapeHtml(p.name)}</h3>
    <div>💵 <b>السعر الإجمالي:</b> <code>$${p.price}</code></div>
    <hr>
    <div><b>🏦 طرق الدفع المتاحة:</b></div>
    ${PAY_HTML}
    <div>📸 بعد إتمام الدفع، أرسل صورة الوصل في المحادثة مع البوت لاستلام طلبك.</div>
    <button class="btn send full" style="margin-top:10px">
      <span class="t">💬 فتح المحادثة وإرسال الوصل</span>
    </button>`;
  paymentBox.querySelector('.send').addEventListener('click', () => {
    tg.openTelegramLink(`https://t.me/${BOT}`);
  });
  elList.appendChild(paymentBox);
  inOrder = true;
  elTitle.textContent = '🎯 تفاصيل الطلب';
  paymentBox.scrollIntoView({ behavior: 'smooth', block: 'center' });
  showBack();
}

try {
  tg.BackButton.onClick(() => {
    if (paymentBox) {
      closePayment();
      inOrder = false;
      elTitle.textContent = '📦 ' + ((CATS.find(c => c.cat === currentCat) || {}).title || 'كل المنتجات');
    } else if (openCard) {
      closeCard();
    } else if (currentCat) {
      renderCategories();
    }
  });
} catch (e) {}

/* تحميل البيانات */
async function load() {
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    ALL = Array.isArray(json.products) ? json.products : [];
  } catch (e) {
    ALL = [];
    elTitle.textContent = '⚠️ تعذّر تحميل المنتجات';
  }
  if (currentCat && !openCard && !paymentBox) showProducts(currentCat);
  else if (!currentCat) renderCategories();
}

renderCategories();
load();
</script>
</body>
</html>
