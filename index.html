<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber VIP Store</title>
    <!-- مكتبة تيليجرام الأساسية لربط الصفحة بالبوت -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            margin: 0; padding: 20px; text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; font-size: 22px; }
        .category-title {
            color: #fff; background: #333; padding: 5px 10px; 
            border-radius: 8px; margin: 20px auto 10px; 
            display: inline-block; font-size: 14px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* زرين في كل سطر */
            gap: 10px;
            max-width: 500px;
            margin: 0 auto;
        }
        /* تصميم الأزرار الزرقاء الأنيقة */
        .product-btn {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background-color: #5c7cfa; color: white; border: none; padding: 12px;
            border-radius: 12px; font-size: 13px; font-weight: bold;
            cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .product-btn:active { transform: scale(0.95); }
        
        /* إعدادات صور الشعارات الأصلية لتظهر بشكل مثالي */
        .product-btn img {
            width: 22px; height: 22px; border-radius: 5px; background: white; padding: 2px; object-fit: contain;
        }
    </style>
</head>
<body>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); 

        function buyProduct(categoryName) {
